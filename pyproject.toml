[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-data-pipeline"
version = "0.1.0"
description = "ETL pipeline for cleaning, validating, and loading healthcare visit data into PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
